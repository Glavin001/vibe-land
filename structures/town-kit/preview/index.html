<style>
*{box-sizing:border-box}body{margin:0;background:#d7d9d5;color:#24352e;font:13px system-ui,sans-serif}canvas{display:block}aside{max-height:calc(100vh - 48px);overflow-y:auto;position:fixed;left:24px;top:24px;width:254px;padding:23px;background:#f9f8f0ed;border:1px solid #ffffff99;border-radius:4px;box-shadow:0 8px 35px #253a2d15}h1{font:400 29px Georgia,serif;margin:6px 0 8px}small{font-size:10px;letter-spacing:.18em;color:#6c796c;text-transform:uppercase}p{line-height:1.6;color:#667268}hr{border:0;border-top:1px solid #d9ded3;margin:20px 0}label{display:block;font-size:10px;letter-spacing:.10em;text-transform:uppercase;margin:14px 0 7px}select,button{font:inherit;padding:9px;border:1px solid #d0d8cc;background:#fffefa;color:#314b3d;border-radius:3px;cursor:pointer}select{width:100%}button:hover{background:#e7ede1}.row{display:flex;gap:6px}.row>*{flex:1}.footer{position:fixed;left:24px;bottom:22px;color:#607163;font-size:11px}#timeline{width:100%}#cannon-hint{font-size:11px;line-height:1.5;margin:9px 0}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-line;font-size:11px;line-height:1.6}.clean aside,.clean .footer{display:none}#error{color:#932c20;white-space:pre-wrap}
</style><body><aside><small>Bayline / town kit</small><h1 id="title">Town structures</h1><p>Town architecture, street props and trees.<br>Made to explore. Built to break.</p><hr><label for="asset">Asset</label><select id="asset" disabled><option>outdoor-gallery</option><option>outdoor-residential-run</option><option>outdoor-market-encounter</option><option>outdoor-service-yard</option><option>outdoor-tree-reuse</option><option>bayline-outdoor-town</option><option>bayline-civic-town</option><option>bayline-small-town</option><option>bayline-district</option><option>bayline-town</option><option>victorian-corner</option><option>porch-house</option><option>corner-grocery</option><option>workshop</option><option>neighborhood-library</option><option>art-deco-cinema</option><option>fire-station</option><option>book-stack</option><option>cinema-seat</option><option>table</option><option>chair</option><option>counter</option><option>sink</option><option>hob</option><option>cabinet</option><option>shelf</option><option>refrigerator</option><option>bed</option><option>sofa</option><option>toilet</option><option>bathtub</option><option>fence</option><option>gate</option></select><label for="camera">Viewpoint</label><select id="camera"></select><label for="recording">Native simulation</label><select id="recording"><option value="">Intact / authoring</option><option value="stability">Gravity stability</option><option>traverse</option><option>glazing</option><option>wall</option><option value="furniture">Limb / prop impact</option><option>fence</option><option value="collapse">Support loss / collapse</option></select><section id="cannon" hidden><hr><small>Cannon range</small><p id="cannon-hint">Aim at wood, then fire. Each shot starts with a fresh tree.</p><label for="ball-mass">Iron ball</label><select id="ball-mass"><option value="10">Small · 10 kg</option><option value="100">Cannon · 100 kg</option><option value="500" selected>Heavy · 500 kg</option><option value="2000">Demolit
