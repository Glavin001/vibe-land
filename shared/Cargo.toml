[package]
name = "vibe-land-shared"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
vibe-netcode = { path = "../netcode" }
bytes = "1"
nalgebra = "0.34"
rapier3d = { version = "0.30", default-features = false, features = ["dim3", "f32", "debug-render"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The browser API (src/wasm_api.rs) the web loads as the `vibe_land_shared` package. Crates that
# build their own WASM package on this one (client-core-wasm, through client-core) leave it out,
# or its exports would be duplicated into theirs.
default = ["wasm-api"]
wasm-api = []
simd-stable = ["rapier3d/simd-stable", "vibe-netcode/simd-stable"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
