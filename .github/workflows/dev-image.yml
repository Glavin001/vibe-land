# Build the developer image: the builder toolchain plus Node and a workstation.
#
# Deliberately NOT triggered on every push. The image ships no application
# source and no build caches, so it only goes stale when the toolchain, Node or
# the clone helper move -- which is what the path filter below tracks. It does
# not depend on Cargo.lock or package-lock.json, because nothing here is
# prebuilt from them.
name: dev-image

on:
  push:
    paths:
      - 'docker/Dockerfile.dev'
      - 'docker/vibe-clone'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:
    inputs:
      builder_image:
        description: Override the toolchain base image
        required: false
      tag:
        description: Tag for the resulting image
        default: latest

# Two of these would race for the same tag.
concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The toolchain base is ~19 GB, which is more than the ~14 GB a standard
      # runner has free before reclaiming.
      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Report free space before the build
        run: df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          # OCI repository names must be lowercase and the GitHub owner is not
          # (Glavin001), so this cannot be interpolated straight into a tag.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ inputs.tag || 'latest' }}"
          echo "image=ghcr.io/${owner}/vibe-land-dev:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            ${{ inputs.builder_image && format('BUILDER_IMAGE={0}', inputs.builder_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Report what shipped
        run: |
          image="${{ steps.meta.outputs.image }}"
          manifest="$(docker run --rm --entrypoint cat "$image" /opt/vibe-land/dev-image.txt)"
          echo "$manifest"
          bytes="$(docker image inspect "$image" --format '{{.Size}}')"
          {
            echo "### Dev image published"
            echo
            echo '```'
            echo "$image"
            echo '```'
            echo
            echo "Size: $(( bytes / 1024 / 1024 / 1024 )) GiB — rent a box with at least double this as disk."
            echo
            echo '```'
            echo "$manifest"
            echo '```'
            echo
            echo "On the box: \`vibe-clone [ref]\`, then build. Nothing is prebuilt — the"
            echo "first build is cold. Mount a Vast volume at \`/opt/vibe-cache\` to keep"
            echo "\`target/\` and the cargo registry across instances."
          } >> "$GITHUB_STEP_SUMMARY"
