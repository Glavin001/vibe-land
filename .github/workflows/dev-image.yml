# Build the developer image: toolchain + warm build caches, no source.
#
# Deliberately NOT triggered on every push. The image ships no application
# source, so it only goes stale when the toolchain, Node, the dependency graph
# or the clone helper move -- which is what the path filter below tracks. Adding
# `server/**` here would rebuild a ~30 GB image on every commit for no benefit.
name: dev-image

on:
  push:
    paths:
      - 'docker/Dockerfile.dev'
      - 'docker/vibe-clone'
      - '.github/workflows/dev-image.yml'
      - 'Cargo.lock'
      - 'client/package-lock.json'
  workflow_dispatch:
    inputs:
      warm_ref:
        description: Ref to warm the build caches against
        default: main
      warm_build:
        description: Set 0 to ship without warm caches (much smaller, much slower on the box)
        default: '1'
      tag:
        description: Tag for the resulting image
        default: latest

# Two of these would race for the same tag and thrash the GHA cache.
concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The 19 GB toolchain base plus a full release build needs far more than
      # the ~14 GB a standard runner has free. If this image outgrows even a
      # reclaimed runner, dispatch with warm_build=0 -- the image is still
      # useful, it just pays the cold build on the box instead.
      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Report free space before the build
        run: df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          # OCI repository names must be lowercase and the GitHub owner is not
          # (Glavin001), so this cannot be interpolated straight into a tag.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ inputs.tag || 'latest' }}"
          {
            echo "warm_ref=${{ inputs.warm_ref || 'main' }}"
            echo "warm_build=${{ inputs.warm_build || '1' }}"
            echo "image=ghcr.io/${owner}/vibe-land-dev:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            WARM_REF=${{ steps.meta.outputs.warm_ref }}
            WARM_BUILD=${{ steps.meta.outputs.warm_build }}
          # No cache-to: this image is large and rebuilt rarely, so exporting a
          # full GHA cache costs more runner disk than it saves.
          cache-from: type=gha

      - name: Report what shipped
        run: |
          image="${{ steps.meta.outputs.image }}"
          manifest="$(docker run --rm --entrypoint cat "$image" /opt/vibe-land/dev-image.txt)"
          echo "$manifest"
          bytes="$(docker image inspect "$image" --format '{{.Size}}')"
          {
            echo "### Dev image published"
            echo
            echo '```'
            echo "$image"
            echo '```'
            echo
            echo "Size: $(( bytes / 1024 / 1024 / 1024 )) GiB — rent a box with at least double this as disk."
            echo
            echo '```'
            echo "$manifest"
            echo '```'
            echo
            echo "On the box: \`vibe-clone [ref]\`, then build."
          } >> "$GITHUB_STEP_SUMMARY"
