# Production deploy: build the server image, then point the control plane at it.
#
# Order matters. The image is pushed and verified before the Worker is told the
# new tag, so a failed image build leaves the fleet renting the previous one
# rather than a tag that does not exist.
#
# Live instances are untouched by a deploy: all fleet state lives in the
# Durable Object, and running boxes keep serving the image they booted with
# until their own uptime cap retires them.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'netcode/**'
      - 'shared/**'
      - 'destruction/**'
      - 'physx-bridge/**'
      - 'control-plane/**'
      - 'docker/**'
      - 'scripts/package-physx-server.sh'
      - '.github/workflows/deploy.yml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          tag="sha-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/vibe-land-server:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/vibe-land-builder:${{ vars.BUILDER_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-control-plane:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - run: npm ci
        working-directory: control-plane

      # The fleet spends money on every path in these tests; do not ship a
      # control plane whose reaper is broken.
      - run: npm test
        working-directory: control-plane

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: control-plane
          # SERVER_IMAGE is the only thing tying this deploy to the image built
          # above; it is what new instances will be created from.
          command: >-
            deploy
            --var SERVER_IMAGE:${{ needs.build-image.outputs.image }}
            --var CONTROL_PLANE_URL:${{ vars.CONTROL_PLANE_URL }}
          secrets: |
            VAST_API_KEY
            HEARTBEAT_TOKEN
            ADMIN_TOKEN
            GHCR_PULL_USER
            GHCR_PULL_TOKEN
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GHCR_PULL_USER: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

  smoke:
    needs: deploy-control-plane
    runs-on: ubuntu-latest
    steps:
      - name: Fleet endpoint responds and reports the new image
        run: |
          fleet="$(curl -fsS -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "${{ vars.CONTROL_PLANE_URL }}/fleet")"
          echo "$fleet"
          echo "$fleet" | grep -q "${{ needs.build-image.outputs.image }}" \
            || { echo "control plane is not serving the image just deployed"; exit 1; }
