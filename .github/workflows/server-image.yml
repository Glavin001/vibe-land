# Build, publish and verify the GPU game server image.
#
# This is the single definition of that build: deploy.yml calls it through
# `workflow_call` rather than repeating the steps, so what ships to production
# is byte-for-byte what a pull request exercised.
#
# It runs on every pull request that touches the server or the image, which is
# the point -- before this existed the only path that built the image was a
# push to main, and that same push immediately deployed a Cloudflare Worker.
# There was no way to shake out a Dockerfile without touching production.
name: server-image

on:
  # Branch pushes, not pull_request: a same-repo PR would otherwise build the
  # identical SHA twice, and each build is ~20 minutes. The push check still
  # shows up on the PR. main is excluded because deploy.yml calls this instead.
  # (GitHub Actions does not support YAML anchors, hence the repeated list.)
  push:
    branches-ignore: [main]
    paths:
      - 'server/**'
      - 'netcode/**'
      - 'shared/**'
      - 'destruction/**'
      - 'physx-bridge/**'
      - 'docker/**'
      # vibe-clone ships in the toolchain image, not this one.
      - '!docker/vibe-clone'
      - 'scripts/package-physx-server.sh'
      - 'scripts/smoke-image.sh'
      - '.github/workflows/server-image.yml'
      - 'Cargo.lock'
  workflow_dispatch:
  workflow_call:
    inputs:
      builder_tag:
        description: Toolchain image tag to compile against
        type: string
        required: false
      publish_latest:
        description: Also tag the result `latest`
        type: boolean
        default: false
    outputs:
      image:
        description: The fully qualified image reference that was pushed
        value: ${{ jobs.build.outputs.image }}

concurrency:
  group: server-image-${{ github.ref }}
  # Superseding an in-flight branch build is right; cancelling one a deploy is
  # waiting on is not.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The builder image is ~15 GB; a standard runner has ~14 GB free.
      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        env:
          BUILDER_TAG: ${{ inputs.builder_tag || vars.BUILDER_IMAGE_TAG }}
        run: |
          # Falls back to the tag builder-image.yml publishes by default, so a
          # fresh clone needs no repository variable set by hand. Point
          # BUILDER_IMAGE_TAG at something else to compile against a different
          # toolchain -- that is what a PhysX or Blast bump looks like.
          if [ -z "$BUILDER_TAG" ]; then
            BUILDER_TAG=cuda12.8-physx-ovphysx-5.5.1
            echo "::notice::BUILDER_IMAGE_TAG is unset; using ${BUILDER_TAG}."
          fi
          # Lowercase: OCI repository names must be, and the owner is not.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          # Tags are immutable and traceable to a commit: the fleet records
          # exactly which build is deployed, and a moving tag would make a
          # rollback ambiguous. `latest` exists only so a person can pull one.
          tag="sha-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          image="ghcr.io/${owner}/vibe-land-server:${tag}"
          {
            echo "tag=${tag}"
            echo "image=${image}"
            echo "builder=ghcr.io/${owner}/vibe-land-builder:${BUILDER_TAG}"
          } >> "$GITHUB_OUTPUT"

          tags="${image}"
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/vibe-land-server:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILDER_IMAGE=${{ steps.meta.outputs.builder }}
            VIBE_LAND_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Server image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}"
            echo '```'
            echo
            echo "Built against \`${{ steps.meta.outputs.builder }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub runners have no GPU, so this cannot assert the PhysX GPU backend --
  # that is what `smoke-image.sh` without --cpu is for, on a rented box. What it
  # can prove is everything that has actually gone wrong in this image before:
  # a library the runtime layer forgot, a missing scene, an entrypoint that
  # advertises the wrong address.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke the image without a GPU
        run: ./scripts/smoke-image.sh --cpu "${{ needs.build.outputs.image }}"

      # The sha- tag says which vibe-land commit built the image, but not which
      # PhysX or Blast commit is compiled into it -- and BLAST_REF is a branch,
      # so the toolchain tag alone cannot answer that either. Printing it here
      # puts the answer in the run log for whoever has to reproduce a result.
      - name: Report what the image was built from
        run: |
          manifest="$(docker run --rm --entrypoint cat \
            "${{ needs.build.outputs.image }}" /opt/vibe-land/manifest.txt)"
          echo "$manifest"
          # This one is passed straight in as a build-arg, so an unresolved
          # value means the wiring is broken and the whole point is lost.
          grep -q '^vibe_land_commit=[0-9a-f]\{40\}$' <<<"$manifest" \
            || { echo "the image does not record its own commit"; exit 1; }
          # These two come from the toolchain image, which is published under a
          # fixed tag by a workflow that fires on the *same* push as this one.
          # So a build that lands first legitimately sees a toolchain image
          # predating the stamping, and failing here would block the image on a
          # race rather than on a defect. It resolves on the next build.
          for key in physx_commit blast_commit; do
            grep -q "^${key}=[0-9a-f]\{40\}$" <<<"$manifest" \
              || echo "::warning::${key} unresolved; rebuild builder-image"
          done
          {
            echo "### Built from"
            echo
            echo '```'
            echo "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the image size a player waits through
        run: |
          bytes="$(docker image inspect "${{ needs.build.outputs.image }}" \
            --format '{{.Size}}')"
          echo "image size: $(( bytes / 1024 / 1024 )) MiB" >> "$GITHUB_STEP_SUMMARY"
