[package]
name = "vibe-land-destruction"
version = "0.1.0"
edition = "2021"
description = "Destructible mini-city: scene assembly, manifest, and the streaming codec core"
publish = false

[dependencies]
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pinned exactly: it compresses the v3 debris wire against a shipped static
# dictionary, so compressor drift is a wire change.
zstd = "=0.13.3"
vibe-netcode = { path = "../netcode" }

[features]
default = []
# Native PhysX-backed runtime on the Blast stress solver (CityDestruction).
# Gated so the crate core stays pure Rust and CI-safe on machines without
# PhysX/CUDA.
physx = ["dep:vibe-land-physx-bridge", "vibe-land-physx-bridge/destruction"]
# The CUDA stress solver -- the one the match server runs.
#
# Without this a test built with `physx` silently gets the CPU CG solve, whose
# 8-iteration residual is reported as real stress: a city nobody touches breaks
# thousands of bonds at rest where the GPU path breaks none. Every number
# measured on that path is an artefact of the solver rather than a property of
# the structure, and it is indistinguishable from a real regression.
cuda-stress = ["physx", "vibe-land-physx-bridge/cuda-stress"]
# Drive destruction through the standardized blast-stress-solver core instead of
# the bespoke ExtStressPhysXDestructible path. Both can be built at once so the
# two can be A/B'd against the same scene before the old path is retired.
blast-core = ["physx", "dep:blast-stress-solver"]
# PhysX-native GPU destruction (physx-2). Needs no Blast checkout. Additive
# with the Blast features so one binary can carry every backend and
# `VIBE_CITY_DESTRUCTION` picks at runtime.
native-destruction = ["dep:vibe-land-physx-bridge", "vibe-land-physx-bridge/native-destruction"]

[dependencies.blast-stress-solver]
# Cargo resolves every optional dependency of a workspace member, even when no
# feature enables it, so this must be reachable from every machine: a missing
# path here fails every cargo command. It is only fetched to resolve, and only
# compiled under `blast-core`.
#
# Keep it on the revision BLAST_ROOT (physx-bridge/build.rs) is checked out at:
# mixing two solver trees in one binary is not a thing anyone wants to debug.
# To build against a local checkout instead, patch it in .cargo/config.toml:
#   [patch."https://github.com/Glavin001/blast-stress-solver"]
#   blast-stress-solver = { path = "<BLAST_ROOT>/blast-stress-solver-rs" }
git = "https://github.com/Glavin001/blast-stress-solver"
branch = "feature/physx-gpu-destruction-2"
optional = true
default-features = false
features = ["physx", "scenarios"]

[dependencies.vibe-land-physx-bridge]
path = "../physx-bridge"
optional = true

# Audits a structure through the Blast rig; it has nothing to run without it.
[[bin]]
name = "structure-audit"
required-features = ["physx"]
