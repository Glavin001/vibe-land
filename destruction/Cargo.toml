[package]
name = "vibe-land-destruction"
version = "0.1.0"
edition = "2021"
description = "Destructible mini-city: scene assembly, manifest, and the streaming codec core"
publish = false

[dependencies]
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pinned exactly: it compresses the v3 debris wire against a shipped static
# dictionary, so compressor drift is a wire change.
zstd = "=0.13.3"
vibe-netcode = { path = "../netcode" }

[features]
default = []
# Native PhysX-backed runtime (CityDestruction). Gated so the crate core stays
# pure Rust and CI-safe on machines without PhysX/CUDA.
physx = ["dep:vibe-land-physx-bridge", "vibe-land-physx-bridge/destruction"]
# The CUDA stress solver -- the one the match server runs.
#
# Without this a test built with `physx` silently gets the CPU CG solve, whose
# 8-iteration residual is reported as real stress: a city nobody touches breaks
# thousands of bonds at rest where the GPU path breaks none. Every number
# measured on that path is an artefact of the solver rather than a property of
# the structure, and it is indistinguishable from a real regression.
cuda-stress = ["physx", "vibe-land-physx-bridge/cuda-stress"]
# Drive destruction through the standardized blast-stress-solver core instead of
# the bespoke ExtStressPhysXDestructible path. Both can be built at once so the
# two can be A/B'd against the same scene before the old path is retired.
blast-core = ["physx", "dep:blast-stress-solver"]

[dependencies.blast-stress-solver]
# Same checkout as BLAST_ROOT in physx-bridge/build.rs: mixing two
# solver trees in one binary is not a thing anyone wants to debug.
path = "/root/workspace/blast-stress-solver/blast/blast-stress-solver-rs"
optional = true
default-features = false
features = ["physx", "scenarios"]

[dependencies.vibe-land-physx-bridge]
path = "../physx-bridge"
optional = true
features = ["destruction"]
