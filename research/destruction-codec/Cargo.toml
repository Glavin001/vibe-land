[package]
name = "destruction-codec"
version = "0.1.0"
edition = "2021"
description = "Offline rate-distortion evaluator for TWTRACE1 rigid-body traces"
license = "MIT OR Apache-2.0"

[lib]
name = "destruction_codec"
path = "src/lib.rs"

[[bin]]
name = "destruction-codec"
path = "src/main.rs"

# glam and zstd decide wire bytes (float math and the compressed stream), so they stay pinned:
# the archive/debris byte tripwires are only meaningful against fixed versions. The rest were
# pinned for build reproducibility and are relaxed to join the vibe-land workspace resolution.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
glam = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "=0.13.3"
