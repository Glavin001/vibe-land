language = "C"
include_guard = "VIBE_CLIENT_CORE_H"
autogen_warning = "/* Generated by cbindgen from client-core-ffi (tests/header_current.rs). Do not edit. */"
include_version = false
usize_is_size_t = true
cpp_compat = true

[export]
prefix = ""
include = ["VlCoreState"]

[defines]

[parse]
# The frame records live in client-core; parse it so the header declares them.
parse_deps = true
include = ["vibe-client-core"]
