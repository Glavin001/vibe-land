[package]
name = "vibe-client-core-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "C ABI over vibe-land's shared client core, linked as a static library by the Unreal client"
publish = false

[lib]
name = "vibe_client_core"
crate-type = ["staticlib", "rlib"]
# The library is named like client-core (the Unreal module links libvibe_client_core.a), which
# rustdoc cannot tell apart; this crate has no doctests.
doctest = false

[dependencies]
vibe-land-shared = { path = "../shared" }
vibe-client-core = { path = "../client-core" }
vibe-client-transport-wt = { path = "../client-transport-wt" }
glam = "0.27"
serde_json = "1"

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
